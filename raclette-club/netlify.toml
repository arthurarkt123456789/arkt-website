[build]
  publish = "public"
  command = ""

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "RC_NOTIFY_EMAIL,RC_REPLY_TO,RC_SITE_URL,RC_FROM,SUPABASE_URL,URL,RC_VAT_RATE,RC_VAT_SERVICES,RC_LICENCE_SHARE,RC_PLATFORM_SHARE,PENNYLANE_COMPANY_ID,PENNYLANE_VAT_CODE,PENNYLANE_TEMPLATE_ID,PENNYLANE_LEDGER_ACCOUNT_ID"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."rc-pennylane-sync"]
  schedule = "*/15 * * * *"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/finance/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
