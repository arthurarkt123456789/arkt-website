[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # Valeurs non secrètes présentes dans les pages (emails, URL Supabase) : exclues du scan de secrets Netlify
  SECRETS_SCAN_OMIT_KEYS = "RC_NOTIFY_EMAIL,RC_REPLY_TO,SUPABASE_URL,URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Propositions commerciales : jamais indexées, jamais mises en cache
[[headers]]
  for = "/devis/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/devis.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Page cachée La Plus Belle Raclette du Monde
[[headers]]
  for = "/raclette/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/raclette-wip/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# La Meulerie Raclette Club : réservation
[[headers]]
  for = "/LAMEULERIERACLETTECLUB/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/LAMEULERIERACLETTECLUB/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Le site de réservation vit désormais sur www.lameulerieracletteclub.com
[[redirects]]
  from = "/LAMEULERIERACLETTECLUB/*"
  to = "https://www.lameulerieracletteclub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/raclette-club/*"
  to = "https://www.lameulerieracletteclub.com/:splat"
  status = 301
  force = true
